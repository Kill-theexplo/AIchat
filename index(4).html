<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roleplay</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161320">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --bg:#161320;
    --panel:#1f1b2e;
    --panel-2:#2a2440;
    --accent:#b98cff;
    --accent-dim:#7a5fb0;
    --text:#efeaf7;
    --text-dim:#a79cc4;
    --bubble-user:#3a3160;
    --bubble-model:#241f38;
    --danger:#e0668a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;
    background:var(--panel);
    border-bottom:1px solid #33304a;
    flex-shrink:0;
  }
  header button.icon{
    background:none;
    border:1px solid #443f60;
    color:var(--text-dim);
    border-radius:8px;
    padding:6px 10px;
    font-size:15px;
    flex-shrink:0;
  }
  #headerTitle{flex:1;min-width:0;cursor:pointer;}
  #headerTitle h1{
    font-size:16px;
    margin:0;
    letter-spacing:.03em;
    color:var(--accent);
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  header .sub{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .headerActions{display:flex;gap:6px;flex-shrink:0;}
  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg{
    max-width:82%;
    padding:10px 13px;
    border-radius:14px;
    font-size:15px;
    line-height:1.4;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    border-bottom-right-radius:4px;
  }
  .msg.model{
    align-self:flex-start;
    background:var(--bubble-model);
    border-bottom-left-radius:4px;
  }
  .msg.error{
    align-self:center;
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    font-size:13px;
  }
  .msg.pending{color:var(--text-dim);font-style:italic;}
  .msg-wrap{display:flex;flex-direction:column;max-width:82%;}
  .msg-wrap.user{align-self:flex-end;align-items:flex-end;}
  .msg-wrap.model{align-self:flex-start;align-items:flex-start;}
  .msg-wrap .msg{max-width:100%;}
  .msg-actions{display:flex;gap:10px;margin-top:2px;padding:0 4px;}
  .msg-actions button{
    background:none;border:none;color:var(--text-dim);
    font-size:12px;padding:2px;line-height:1;opacity:.7;
  }
  .msg-actions button:active{opacity:1;}
  .edit-box{width:100%;}
  .edit-box textarea{
    width:100%;min-height:60px;font-size:15px;
    background:var(--panel-2);border:1px solid var(--accent-dim);
    border-radius:10px;color:var(--text);padding:8px 10px;
  }
  .edit-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}
  .edit-actions button{
    border-radius:8px;padding:5px 12px;font-size:12px;
    border:1px solid #443f60;background:var(--panel-2);color:var(--text);
  }
  .edit-actions button.primary{background:var(--accent);color:#1a1428;border:none;font-weight:700;}
  .msg-wrap.selectable{width:100%;max-width:100%;}
  .select-row{display:flex;align-items:center;gap:8px;width:100%;}
  .select-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);}
  .select-row .msg{max-width:78%;}
  #selectBar{
    display:none;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:var(--panel);
    border-top:1px solid #33304a;
    flex-shrink:0;
    font-size:13px;
    color:var(--text-dim);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  }
  #selectBar .actions{display:flex;gap:8px;}
  #selectBar button{
    border-radius:8px;padding:6px 12px;font-size:13px;
    border:1px solid #443f60;background:var(--panel-2);color:var(--text);
  }
  #selectBar button.danger{border-color:var(--danger);color:var(--danger);}
  #empty{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:0 30px;
  }
  form#composer{
    display:flex;
    gap:8px;
    padding:10px;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    background:var(--panel);
    border-top:1px solid #33304a;
    flex-shrink:0;
  }
  #input{
    flex:1;
    resize:none;
    border-radius:20px;
    border:1px solid #443f60;
    background:var(--panel-2);
    color:var(--text);
    padding:10px 16px;
    font-size:15px;
    max-height:120px;
  }
  #send{
    border:none;
    background:var(--accent);
    color:#1a1428;
    font-weight:700;
    border-radius:20px;
    padding:0 18px;
    font-size:15px;
  }
  #send:disabled{opacity:.5;}
  dialog{
    border:none;
    border-radius:16px;
    background:var(--panel);
    color:var(--text);
    width:min(440px,92vw);
    padding:0;
  }
  dialog::backdrop{background:rgba(0,0,0,.6);}
  .dlg-body{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:82vh;overflow-y:auto;}
  .dlg-body h2{margin:0;font-size:17px;color:var(--accent);}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:5px;}
  input[type=text],input[type=password],textarea,select{
    width:100%;
    background:var(--panel-2);
    border:1px solid #443f60;
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  .dlg-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;}
  .dlg-actions .right{display:flex;gap:8px;}
  .dlg-actions button{
    border-radius:8px;
    padding:9px 16px;
    font-size:14px;
    border:1px solid #443f60;
    background:var(--panel-2);
    color:var(--text);
  }
  .dlg-actions button.primary{background:var(--accent);color:#1a1428;border:none;font-weight:700;}
  .dlg-actions button.danger{border-color:var(--danger);color:var(--danger);}
  .hint{font-size:11px;color:var(--text-dim);}

  /* chat drawer */
  .drawer{
    position:fixed;top:0;left:0;bottom:0;
    width:82%;max-width:320px;
    background:var(--panel);
    transform:translateX(-100%);
    transition:transform .22s ease;
    z-index:60;
    display:flex;flex-direction:column;
    box-shadow:2px 0 20px rgba(0,0,0,.4);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .22s;z-index:55;
  }
  .drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
    border-bottom:1px solid #33304a;
  }
  .drawer-header h2{margin:0;font-size:16px;color:var(--accent);}
  .drawer-header button{background:none;border:none;color:var(--text-dim);font-size:18px;}
  .newChatRow{
    margin:12px 16px;padding:10px;border-radius:10px;
    background:var(--accent);color:#1a1428;font-weight:700;border:none;font-size:14px;
  }
  #chatList{overflow-y:auto;flex:1;}
  .chat-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:12px 16px;border-bottom:1px solid #2c2740;cursor:pointer;
  }
  .chat-row.active{background:var(--panel-2);}
  .chat-row .titleText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;}
  .chat-row button{background:none;border:none;color:var(--text-dim);font-size:14px;padding:4px;flex-shrink:0;}
</style>
</head>
<body>

<header>
  <button class="icon" id="menuBtn" title="Chats">☰</button>
  <div id="headerTitle" title="Tap to rename / edit persona">
    <h1 id="charName">Roleplay</h1>
    <div class="sub" id="modelLabel">not configured</div>
  </div>
  <div class="headerActions">
    <button class="icon" id="selectBtn" title="Select messages">☑</button>
    <button class="icon" id="newChatBtn" title="New chat">+</button>
    <button class="icon" id="settingsBtn" title="API settings">⚙</button>
  </div>
</header>

<div id="chat">
  <div id="empty">Set your API key in Settings (⚙), then start typing.</div>
</div>

<div id="selectBar">
  <span id="selectCount">0 selected</span>
  <div class="actions">
    <button type="button" id="selectAllBtn">Select all</button>
    <button type="button" id="deleteSelectedBtn" class="danger">Delete</button>
    <button type="button" id="cancelSelectBtn">Cancel</button>
  </div>
</div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Say something…" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<!-- chat list drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="chatDrawer">
  <div class="drawer-header">
    <h2>Chats</h2>
    <button id="closeDrawer">✕</button>
  </div>
  <button class="newChatRow" id="newChatBtn2">+ New chat</button>
  <div id="chatList"></div>
</div>

<!-- API settings dialog -->
<dialog id="settingsDlg">
  <div class="dlg-body">
    <h2>API settings</h2>
    <div>
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="gemini">Google (Gemini)</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="custom">Custom (OpenAI-compatible)</option>
      </select>
    </div>
    <div>
      <label for="apiKey">API key</label>
      <input type="password" id="apiKey" placeholder="paste your key">
      <div class="hint">Stored only in this browser (localStorage), sent only to the API URL below. Shared across all your chats.</div>
    </div>
    <div>
      <label for="baseUrl">API base URL</label>
      <input type="text" id="baseUrl" placeholder="https://…">
      <div class="hint" id="urlHint"></div>
    </div>
    <div class="row">
      <div>
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="model name">
      </div>
      <div>
        <label for="temp">Temperature</label>
        <input type="text" id="temp" placeholder="1.0">
      </div>
    </div>
    <div class="dlg-actions">
      <div></div>
      <div class="right">
        <button type="button" id="closeSettings">Cancel</button>
        <button type="button" id="saveSettings" class="primary">Save</button>
      </div>
    </div>
  </div>
</dialog>

<!-- per-chat details dialog -->
<dialog id="chatEditDlg">
  <div class="dlg-body">
    <h2>Chat details</h2>
    <div>
      <label for="chatTitleInput">Chat title</label>
      <input type="text" id="chatTitleInput" placeholder="e.g. The lighthouse story">
    </div>
    <div>
      <label for="chatCharName">Character / narrator name (shown at the top)</label>
      <input type="text" id="chatCharName" placeholder="e.g. Narrator, Kaelen">
    </div>
    <div>
      <label for="chatPersona">Persona / system instructions</label>
      <textarea id="chatPersona" placeholder="Describe the character, narrator style, scenario, boundaries, etc. — specific to this chat."></textarea>
    </div>
    <div class="dlg-actions">
      <button type="button" id="clearChatMsgs" class="danger">Clear messages</button>
      <div class="right">
        <button type="button" id="closeChatEdit">Cancel</button>
        <button type="button" id="saveChatEdit" class="primary">Save</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const chatEl = $('chat'), inputEl = $('input'), form = $('composer'), sendBtn = $('send');
const settingsDlg = $('settingsDlg'), chatEditDlg = $('chatEditDlg');
const drawer = $('chatDrawer'), drawerBackdrop = $('drawerBackdrop'), chatListEl = $('chatList');

const PROVIDER_DEFAULTS = {
  gemini:    { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models', model: 'gemini-2.5-flash', hint: "Standard Gemini REST endpoint." },
  openai:    { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini', hint: "OpenAI's own API. Swap for any OpenAI-compatible host (e.g. OpenRouter) too." },
  anthropic: { baseUrl: 'https://api.anthropic.com/v1', model: 'claude-sonnet-4-6', hint: "Requires no proxy — this app sends the browser-access header for you." },
  custom:    { baseUrl: '', model: '', hint: "Any server implementing the OpenAI chat/completions format (local models, OpenRouter, etc.)." }
};

let settings = JSON.parse(localStorage.getItem('rp_settings') || '{}');
let chats = JSON.parse(localStorage.getItem('rp_chats') || 'null');
let activeId = localStorage.getItem('rp_active') || null;
let selectMode = false;
let selected = new Set();

function genId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function newChatObj(){ return { id: genId(), title: 'New chat', charName: '', persona: '', messages: [], updatedAt: Date.now() }; }

// one-time migration from the earlier single-chat version of this app
if(!chats){
  const oldMessages = JSON.parse(localStorage.getItem('rp_messages') || '[]');
  const first = newChatObj();
  first.messages = oldMessages;
  first.charName = settings.charName || '';
  first.persona = settings.persona || '';
  if(oldMessages.length) first.title = oldMessages[0].text.slice(0, 40);
  chats = [first];
  activeId = first.id;
  delete settings.charName;
  delete settings.persona;
}
if(!chats.length){ chats = [newChatObj()]; }
if(!activeId || !chats.find(c => c.id === activeId)) activeId = chats[0].id;

function activeChat(){ return chats.find(c => c.id === activeId); }
function persistChats(){ localStorage.setItem('rp_chats', JSON.stringify(chats)); localStorage.setItem('rp_active', activeId); }
function persistSettings(){ localStorage.setItem('rp_settings', JSON.stringify(settings)); }
persistChats();

function applyHeader(){
  const c = activeChat();
  $('charName').textContent = c.charName || c.title || 'Roleplay';
  $('modelLabel').textContent = settings.apiKey
    ? `${settings.provider || 'gemini'} · ${settings.model || '?'}`
    : 'API not configured — tap ⚙';
}

// ---------- message rendering ----------

function bubbleText(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  return d;
}

function renderMessage(m, idx, isLast){
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (m.role === 'user' ? 'user' : 'model');

  if(selectMode){
    wrap.classList.add('selectable');
    const row = document.createElement('div');
    row.className = 'select-row';
    row.style.flexDirection = m.role === 'user' ? 'row-reverse' : 'row';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selected.has(idx);
    const toggle = () => {
      cb.checked ? selected.add(idx) : selected.delete(idx);
      updateSelectCount();
    };
    cb.onchange = toggle;

    const bubbleWrap = document.createElement('div');
    bubbleWrap.appendChild(bubbleText(m.role === 'user' ? 'user' : 'model', m.text));

    row.append(cb, bubbleWrap);
    row.addEventListener('click', (e) => {
      if(e.target === cb) return;
      cb.checked = !cb.checked;
      toggle();
    });
    wrap.appendChild(row);
    return wrap;
  }

  const content = document.createElement('div');
  content.appendChild(bubbleText(m.role === 'user' ? 'user' : 'model', m.text));

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const editBtn = document.createElement('button');
  editBtn.type = 'button'; editBtn.textContent = '✎ Edit';
  editBtn.onclick = () => startEdit(idx, wrap, m);

  const delBtn = document.createElement('button');
  delBtn.type = 'button'; delBtn.textContent = '🗑 Delete';
  delBtn.onclick = () => {
    if(confirm('Delete this message?')){
      activeChat().messages.splice(idx, 1);
      persistChats();
      render();
    }
  };

  actions.append(editBtn, delBtn);

  if(m.role === 'model' && isLast){
    const regenBtn = document.createElement('button');
    regenBtn.type = 'button'; regenBtn.textContent = '↻ Regenerate';
    regenBtn.onclick = () => regenerateLast();
    actions.appendChild(regenBtn);
  }

  wrap.append(content, actions);
  return wrap;
}

function startEdit(idx, wrap, m){
  wrap.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'edit-box';
  const ta = document.createElement('textarea');
  ta.value = m.text;
  box.appendChild(ta);

  const actions = document.createElement('div');
  actions.className = 'edit-actions';
  const cancel = document.createElement('button');
  cancel.type = 'button'; cancel.textContent = 'Cancel';
  cancel.onclick = () => render();
  const save = document.createElement('button');
  save.type = 'button'; save.textContent = 'Save'; save.className = 'primary';
  save.onclick = () => {
    activeChat().messages[idx].text = ta.value;
    persistChats();
    render();
  };
  actions.append(cancel, save);
  box.appendChild(actions);
  wrap.appendChild(box);
  ta.focus();
}

function render(){
  chatEl.innerHTML = '';
  const msgs = activeChat().messages;
  if(msgs.length === 0){
    const empty = document.createElement('div');
    empty.id = 'empty';
    empty.textContent = settings.apiKey
      ? 'Say something to start the scene.'
      : 'Set your API key in Settings (⚙), then start typing.';
    chatEl.appendChild(empty);
    return;
  }
  msgs.forEach((m, idx) => chatEl.appendChild(renderMessage(m, idx, idx === msgs.length - 1)));
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---------- chat drawer ----------

function renderChatList(){
  chatListEl.innerHTML = '';
  chats.slice().sort((a,b) => b.updatedAt - a.updatedAt).forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat-row' + (c.id === activeId ? ' active' : '');
    const t = document.createElement('div');
    t.className = 'titleText';
    t.textContent = c.charName ? `${c.title} · ${c.charName}` : (c.title || 'New chat');
    const del = document.createElement('button');
    del.textContent = '🗑';
    del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    row.append(t, del);
    row.onclick = () => { switchChat(c.id); closeDrawer(); };
    chatListEl.appendChild(row);
  });
}

function switchChat(id){ activeId = id; toggleSelectMode(false); persistChats(); applyHeader(); render(); }

function deleteChat(id){
  if(chats.length === 1){ alert("Can't delete your only chat — clear its messages instead, or make a new one first."); return; }
  if(!confirm('Delete this chat? This cannot be undone.')) return;
  chats = chats.filter(c => c.id !== id);
  if(activeId === id) activeId = chats[0].id;
  persistChats(); applyHeader(); render(); renderChatList();
}

function createNewChat(){
  const c = newChatObj();
  chats.unshift(c);
  activeId = c.id;
  toggleSelectMode(false);
  persistChats();
  applyHeader(); render(); closeDrawer();
}

function openDrawer(){ renderChatList(); drawer.classList.add('open'); drawerBackdrop.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); drawerBackdrop.classList.remove('open'); }

// ---------- multi-select delete ----------

function updateSelectCount(){
  $('selectCount').textContent = `${selected.size} selected`;
}

function toggleSelectMode(on){
  selectMode = on;
  selected.clear();
  $('selectBar').style.display = on ? 'flex' : 'none';
  form.style.display = on ? 'none' : 'flex';
  updateSelectCount();
  render();
}

$('selectBtn').onclick = () => toggleSelectMode(!selectMode);
$('cancelSelectBtn').onclick = () => toggleSelectMode(false);
$('selectAllBtn').onclick = () => {
  const msgs = activeChat().messages;
  if(selected.size === msgs.length){
    selected.clear();
  } else {
    msgs.forEach((_, i) => selected.add(i));
  }
  updateSelectCount();
  render();
};
$('deleteSelectedBtn').onclick = () => {
  if(selected.size === 0) return;
  if(!confirm(`Delete ${selected.size} message(s)? This cannot be undone.`)) return;
  const msgs = activeChat().messages;
  activeChat().messages = msgs.filter((_, i) => !selected.has(i));
  persistChats();
  toggleSelectMode(false);
};

$('menuBtn').onclick = openDrawer;
$('closeDrawer').onclick = closeDrawer;
drawerBackdrop.onclick = closeDrawer;
$('newChatBtn').onclick = createNewChat;
$('newChatBtn2').onclick = createNewChat;

// ---------- per-chat details dialog ----------

$('headerTitle').onclick = () => {
  const c = activeChat();
  $('chatTitleInput').value = c.title || '';
  $('chatCharName').value = c.charName || '';
  $('chatPersona').value = c.persona || '';
  chatEditDlg.showModal();
};
$('closeChatEdit').onclick = () => chatEditDlg.close();
$('saveChatEdit').onclick = () => {
  const c = activeChat();
  c.title = $('chatTitleInput').value.trim() || 'New chat';
  c.charName = $('chatCharName').value.trim();
  c.persona = $('chatPersona').value;
  c.updatedAt = Date.now();
  persistChats();
  applyHeader(); render();
  chatEditDlg.close();
};
$('clearChatMsgs').onclick = () => {
  if(confirm('Clear all messages in this chat? The title and persona stay.')){
    activeChat().messages = [];
    persistChats();
    render();
    chatEditDlg.close();
  }
};

// ---------- API settings dialog ----------

function openSettings(){
  const provider = settings.provider || 'gemini';
  $('provider').value = provider;
  $('apiKey').value = settings.apiKey || '';
  $('baseUrl').value = settings.baseUrl || PROVIDER_DEFAULTS[provider].baseUrl;
  $('urlHint').textContent = PROVIDER_DEFAULTS[provider].hint;
  $('model').value = settings.model || PROVIDER_DEFAULTS[provider].model;
  $('temp').value = settings.temp || '1.0';
  settingsDlg.showModal();
}

$('provider').onchange = () => {
  const p = $('provider').value;
  const wasDefault = Object.values(PROVIDER_DEFAULTS).some(d => d.baseUrl === $('baseUrl').value);
  if(wasDefault || !$('baseUrl').value){
    $('baseUrl').value = PROVIDER_DEFAULTS[p].baseUrl;
    $('model').value = PROVIDER_DEFAULTS[p].model;
  }
  $('urlHint').textContent = PROVIDER_DEFAULTS[p].hint;
};

$('settingsBtn').onclick = openSettings;
$('closeSettings').onclick = () => settingsDlg.close();
$('saveSettings').onclick = () => {
  settings.provider = $('provider').value;
  settings.apiKey = $('apiKey').value.trim();
  settings.baseUrl = $('baseUrl').value.trim().replace(/\/+$/, '');
  settings.model = $('model').value.trim();
  settings.temp = parseFloat($('temp').value) || 1.0;
  persistSettings();
  applyHeader();
  render();
  settingsDlg.close();
};

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ---------- provider request/response adapters ----------

function buildRequest(){
  const { provider, baseUrl, model, apiKey, temp } = settings;
  const c = activeChat();
  const history = c.messages;

  if(provider === 'gemini'){
    const contents = history.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));
    const body = { contents, generationConfig: { temperature: temp || 1.0 } };
    if(c.persona) body.systemInstruction = { parts: [{ text: c.persona }] };
    return {
      url: `${baseUrl}/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body
    };
  }

  if(provider === 'anthropic'){
    const body = {
      model,
      max_tokens: 2048,
      temperature: temp || 1.0,
      stream: true,
      messages: history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
    };
    if(c.persona) body.system = c.persona;
    return {
      url: `${baseUrl}/messages`,
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body
    };
  }

  // openai + custom (OpenAI-compatible chat/completions)
  const msgs = [];
  if(c.persona) msgs.push({ role: 'system', content: c.persona });
  history.forEach(m => msgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
  return {
    url: `${baseUrl}/chat/completions`,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: { model, temperature: temp || 1.0, stream: true, messages: msgs }
  };
}

function extractError(provider, data, status){
  return data?.error?.message || data?.error?.type || `Request failed (${status})`;
}

// Reads a Server-Sent Events response body, calling onChunk(parsedJson) for each
// "data: {...}" line as it arrives (skips the "[DONE]" sentinel some providers send).
async function streamSSE(res, onChunk){
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while(true){
    const { value, done } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop(); // last (possibly incomplete) line stays in the buffer
    for(const line of lines){
      const t = line.trim();
      if(!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if(payload === '[DONE]') continue;
      let json;
      try{ json = JSON.parse(payload); } catch(e){ continue; }
      onChunk(json);
    }
  }
}

// Pulls the incremental text out of one streamed chunk, per provider's format.
function extractStreamPiece(provider, chunk){
  if(provider === 'gemini'){
    return (chunk.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  }
  if(provider === 'anthropic'){
    if(chunk.type === 'content_block_delta' && chunk.delta?.type === 'text_delta'){
      return chunk.delta.text || '';
    }
    return '';
  }
  // openai + custom
  return chunk.choices?.[0]?.delta?.content || '';
}

// ---------- send / regenerate ----------

// Calls the configured API with the current chat's history, streams the reply
// into a live bubble, then saves it as a new message once done.
async function streamAssistantReply(){
  const c = activeChat();
  sendBtn.disabled = true;
  const pending = bubbleText('model pending', '…');
  chatEl.appendChild(pending);
  chatEl.scrollTop = chatEl.scrollHeight;

  try{
    const { url, headers, body } = buildRequest();
    const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });

    if(!res.ok){
      pending.remove();
      let data = {};
      try{ data = await res.json(); } catch(err){ /* non-JSON error body */ }
      chatEl.appendChild(bubbleText('error', extractError(settings.provider, data, res.status)));
    } else {
      pending.classList.remove('pending');
      pending.textContent = '';
      let fullText = '';
      await streamSSE(res, (chunk) => {
        const piece = extractStreamPiece(settings.provider, chunk);
        if(piece){
          fullText += piece;
          pending.textContent = fullText;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      });
      c.messages.push({ role: 'model', text: fullText || '(empty response)' });
      c.updatedAt = Date.now();
      persistChats();
      render();
    }
  } catch(err){
    pending.remove();
    chatEl.appendChild(bubbleText('error', 'Network error: ' + err.message));
  } finally {
    sendBtn.disabled = false;
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

function regenerateLast(){
  const c = activeChat();
  const msgs = c.messages;
  if(msgs.length === 0 || msgs[msgs.length - 1].role !== 'model') return;
  msgs.pop(); // drop the reply we're replacing
  persistChats();
  render();
  streamAssistantReply();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if(!text) return;
  if(!settings.apiKey || !settings.baseUrl || !settings.model){ openSettings(); return; }

  const c = activeChat();
  c.messages.push({ role: 'user', text });
  if(c.title === 'New chat') c.title = text.slice(0, 40);
  c.updatedAt = Date.now();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  persistChats();
  render();

  streamAssistantReply();
});

applyHeader();
render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
